<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="theme-color"
      media="(prefers-color-scheme: light)"
      content="#f4ecd8"
    />
    <meta
      name="theme-color"
      media="(prefers-color-scheme: dark)"
      content="#17130f"
    />
    <meta name="description" content="A local-first EPUB reader" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500;600;700&family=Literata:opsz,wght@7..72,300..900&family=Plus+Jakarta+Sans:wght@200..800&display=swap"
      rel="stylesheet"
    />
    <title>Librune</title>
    <script>
      // Apply the saved explicit theme before first paint so a user whose
      // choice differs from their OS prefers-color-scheme doesn't see a flash.
      // Mirrors useApplyTheme; the persisted shape is zustand's { state: {...} }.
      try {
        var t = JSON.parse(localStorage.getItem("librune-preferences") || "{}");
        t = t && t.state && t.state.theme;
        if (t === "dark" || t === "light")
          document.documentElement.classList.add(t);
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
