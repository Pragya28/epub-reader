<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 60" width="100%" aria-hidden="true">
  <defs>
    <radialGradient id="iw-left" cx="28%" cy="50%" r="35%">
      <stop offset="0%" stop-color="currentColor" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="currentColor" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="iw-right" cx="72%" cy="50%" r="30%">
      <stop offset="0%" stop-color="currentColor" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="currentColor" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="iw-center" cx="50%" cy="50%" r="20%">
      <stop offset="0%" stop-color="currentColor" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="currentColor" stop-opacity="0"/>
    </radialGradient>
    <filter id="iw-blur">
      <feGaussianBlur stdDeviation="6"/>
    </filter>
  </defs>
  <!-- Wash blobs -->
  <rect x="0" y="0" width="500" height="60" fill="url(#iw-left)" filter="url(#iw-blur)"/>
  <rect x="0" y="0" width="500" height="60" fill="url(#iw-right)" filter="url(#iw-blur)"/>
  <rect x="0" y="0" width="500" height="60" fill="url(#iw-center)" filter="url(#iw-blur)"/>
  <!-- Hairline rules with fades -->
  <defs>
    <linearGradient id="iw-lineL" x1="0%" x2="100%" y1="0%" y2="0%">
      <stop offset="0%" stop-color="currentColor" stop-opacity="0"/>
      <stop offset="45%" stop-color="currentColor" stop-opacity="0.3"/>
      <stop offset="50%" stop-color="currentColor" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="iw-lineR" x1="0%" x2="100%" y1="0%" y2="0%">
      <stop offset="50%" stop-color="currentColor" stop-opacity="0"/>
      <stop offset="55%" stop-color="currentColor" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="currentColor" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <line x1="0" y1="30" x2="500" y2="30" stroke="url(#iw-lineL)" stroke-width="0.6"/>
  <line x1="0" y1="30" x2="500" y2="30" stroke="url(#iw-lineR)" stroke-width="0.6"/>
  <!-- Fleuron -->
  <text x="250" y="36"
    text-anchor="middle"
    font-family="serif"
    font-size="16"
    fill="currentColor"
    opacity="0.55">❧</text>
</svg>