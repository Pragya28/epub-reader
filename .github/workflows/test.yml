name: Test Suite
on:
  push:
    branches: [main]
  pull_request:

jobs:
  vitest:
    name: Vitest
    runs-on: ubuntu-latest
    # Real Postgres for the backend race tests; pglite is single-connection.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://postgres:test@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v4
      # Node must be set up before pnpm/action-setup: pnpm 11 requires
      # Node >=22.13, newer than the runner's preinstalled default.
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: pnpm/action-setup@v4
        with:
          version: 11.1.2
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:run

  playwright:
    name: Playwright (cross-device e2e)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: pnpm/action-setup@v4
        with:
          version: 11.1.2
      - run: pnpm install --frozen-lockfile
      - run: npx playwright install --with-deps chromium
      - run: pnpm test:e2e
